<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surveillance</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 10px; }
        #status { color: #0f0; font-size: 12px; margin-bottom: 5px; }
        button { padding: 15px; width: 90%; margin: 5px 0; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; }
        input { width: 90%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #555; }
        .hidden { display: none; }
        video { width: 100%; max-width: 300px; }
    </style>
</head>
<body>
    <h2>👁️ Espion</h2>
    <div id="status">En attente...</div>
    
    <!-- Pour voir ce qu'on envoie (optionnel) -->
    <video id="local" autoplay muted playsinline style="display:none"></video>

    <div id="controls">
        <p>ID : <span id="myId">Chargement...</span></p>
        <button onclick="copyId()">Copier mon ID</button>
        <hr>
        <input type="text" id="targetId" placeholder="ID de l'espion à joindre">
        <button onclick="connect()">Se connecter à l'espion</button>
    </div>

    <script>
        // Configuration
        const peer = new Peer({ debug: 0 });
        let localStream;
        let call;

        peer.on('open', (id) => {
            document.getElementById('myId').innerText = id;
            document.getElementById('status').innerText = "En ligne";
            // On garde le flux vivant
            startCamera();
        });

        async function startCamera() {
            if (localStream) return;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }, 
                    audio: true 
                });
                document.getElementById('local').srcObject = localStream;
                return true;
            } catch (e) {
                alert("Erreur caméra");
                return false;
            }
        }

        peer.on('call', async (incomingCall) => {
            const camOk = await startCamera();
            if(camOk) {
                incomingCall.answer(localStream);
                incomingCall.on('stream', (stream) => {
                    // On pourrait afficher la vidéo reçue ici si on veut
                });
                document.getElementById('status').innerText = "Appel en cours...";
            }
        });

        async function connect() {
            const target = document.getElementById('targetId').value;
            if(!target) return;
            
            const camOk = await startCamera();
            if(camOk) {
                call = peer.call(target, localStream);
                call.on('close', () => {
                    document.getElementById('status').innerText = "Déconnecté";
                });
            }
        }

        function copyId() {
            const id = document.getElementById('myId').innerText;
            navigator.clipboard.writeText(id);
            alert("ID copié !");
        }
    </script>
</body>
</html>
